<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>ミエール Mieru</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="ミエール">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="" width="40" height="40">
      <div>
        <h1>ミエール <span class="latin">Mieru</span></h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <select id="lang" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ko">한국어</option>
    </select>
  </header>



  <main>
    <div id="demo-banner" class="banner" hidden data-i18n="demo"></div>

    <section id="capture">
      <div class="slots">
        <label class="slot" data-slot="0">
          <input type="file" accept="image/*" capture="environment" hidden>
          <span class="slot-title" data-i18n="front"></span>
          <span class="slot-empty"><span class="plus">＋</span><span data-i18n="addPhoto"></span></span>
          <img alt="" hidden>
          <button type="button" class="remove" hidden data-i18n-aria="remove">×</button>
        </label>
        <label class="slot primary" data-slot="1">
          <input type="file" accept="image/*" capture="environment" hidden>
          <span class="slot-title" data-i18n="back"></span>
          <span class="slot-empty"><span class="plus">＋</span><span data-i18n="addPhoto"></span></span>
          <img alt="" hidden>
          <button type="button" class="remove" hidden data-i18n-aria="remove">×</button>
        </label>
        <label class="slot" data-slot="2">
          <input type="file" accept="image/*" hidden>
          <span class="slot-title" data-i18n="extra"></span>
          <span class="slot-empty"><span class="plus">＋</span><span data-i18n="addPhoto"></span></span>
          <img alt="" hidden>
          <button type="button" class="remove" hidden data-i18n-aria="remove">×</button>
        </label>
        <label class="slot" data-slot="3">
          <input type="file" accept="image/*" hidden>
          <span class="slot-title" data-i18n="extra"></span>
          <span class="slot-empty"><span class="plus">＋</span><span data-i18n="addPhoto"></span></span>
          <img alt="" hidden>
          <button type="button" class="remove" hidden data-i18n-aria="remove">×</button>
        </label>
      </div>
      <p class="hint" data-i18n="hint"></p>
      <button id="analyze" class="cta" type="button" data-i18n="analyze"></button>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section id="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p data-i18n="analyzing"></p>
    </section>

    <section id="result" hidden></section>

    <section id="history" hidden>
      <p class="hint" data-i18n="selectHint"></p>
      <ul id="history-list" class="history"></ul>
      <p id="history-empty" class="empty" data-i18n="historyEmpty" hidden></p>
      <div class="sticky-bar"><button id="compare-btn" class="cta" type="button" disabled></button></div>
    </section>

    <section id="compare" hidden>
      <button type="button" class="link-btn" id="back-history" data-i18n="backToHistory"></button>
      <h2 class="view-title" data-i18n="compareTitle"></h2>
      <p class="hint" data-i18n="compareHint"></p>
      <div id="compare-table"></div>
      <section class="card ai-box">
        <h2 data-i18n="aiCompare"></h2>
        <input id="goal" type="text" maxlength="200" data-i18n-placeholder="goalPlaceholder">
        <button id="ai-compare-btn" class="cta" type="button" data-i18n="aiCompareBtn"></button>
        <p id="compare-error" class="error" role="alert" hidden></p>
      </section>
      <div id="ai-loading" hidden><div class="spinner" aria-hidden="true"></div><p data-i18n="aiComparing"></p></div>
      <div id="ai-result"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Menu">
    <button type="button" class="tab nav-item" data-tab="history">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="tabHistory"></span><span id="history-count" class="count"></span>
    </button>
    <button type="button" class="tab nav-scan active" data-tab="scan">
      <span class="scan-circle"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></span>
      <span data-i18n="tabScan"></span>
    </button>
    <button type="button" class="tab nav-item" data-tab="compare">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="3" y="4" width="7" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="14" y="4" width="7" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span data-i18n="tabCompare"></span>
    </button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
