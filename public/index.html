<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Label Lens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">◎</span>
      <div>
        <h1>Label Lens</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <select id="lang" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ko">한국어</option>
    </select>
  </header>

  <main>
    <div id="demo-banner" class="banner" hidden data-i18n="demo"></div>

    <section id="capture">
      <div class="slots">
        <label class="slot" data-slot="0">
          <input type="file" accept="image/*" capture="environment" hidden>
          <span class="slot-title" data-i18n="front"></span>
          <span class="slot-empty"><span class="plus">＋</span><span data-i18n="addPhoto"></span></span>
          <img alt="" hidden>
          <button type="button" class="remove" hidden data-i18n-aria="remove">×</button>
        </label>
        <label class="slot primary" data-slot="1">
          <input type="file" accept="image/*" capture="environment" hidden>
          <span class="slot-title" data-i18n="back"></span>
          <span class="slot-empty"><span class="plus">＋</span><span data-i18n="addPhoto"></span></span>
          <img alt="" hidden>
          <button type="button" class="remove" hidden data-i18n-aria="remove">×</button>
        </label>
        <label class="slot" data-slot="2">
          <input type="file" accept="image/*" hidden>
          <span class="slot-title" data-i18n="extra"></span>
          <span class="slot-empty"><span class="plus">＋</span><span data-i18n="addPhoto"></span></span>
          <img alt="" hidden>
          <button type="button" class="remove" hidden data-i18n-aria="remove">×</button>
        </label>
        <label class="slot" data-slot="3">
          <input type="file" accept="image/*" hidden>
          <span class="slot-title" data-i18n="extra"></span>
          <span class="slot-empty"><span class="plus">＋</span><span data-i18n="addPhoto"></span></span>
          <img alt="" hidden>
          <button type="button" class="remove" hidden data-i18n-aria="remove">×</button>
        </label>
      </div>
      <p class="hint" data-i18n="hint"></p>
      <button id="analyze" class="cta" type="button" data-i18n="analyze"></button>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section id="loading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p data-i18n="analyzing"></p>
    </section>

    <section id="result" hidden></section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
