<title>ミエール Mieru</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #f6f7f5;
  --card: #ffffff;
  --text: #1c2321;
  --muted: #5d6b67;
  --line: #e2e6e3;
  --accent: #0f766e;
  --accent-ink: #ffffff;
  --safe: #15803d;
  --low: #4d7c0f;
  --caution: #b45309;
  --warning: #c2410c;
  --danger: #b91c1c;
  --unknown: #6b7280;
  --on-level: #ffffff; /* text on a level-colored badge */
  color-scheme: light;
}
/* Dark palette: follows the system setting unless claude.ai's theme is set explicitly. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111615;
    --card: #1a201f;
    --text: #e8eeec;
    --muted: #9aa8a4;
    --line: #2c3533;
    --accent: #2dd4bf;
    --accent-ink: #062a26;
    --safe: #4ade80;
    --low: #a3e635;
    --caution: #fbbf24;
    --warning: #fb923c;
    --danger: #f87171;
    --unknown: #9ca3af;
    --on-level: #0b1110;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111615;
  --card: #1a201f;
  --text: #e8eeec;
  --muted: #9aa8a4;
  --line: #2c3533;
  --accent: #2dd4bf;
  --accent-ink: #062a26;
  --safe: #4ade80;
  --low: #a3e635;
  --caution: #fbbf24;
  --warning: #fb923c;
  --danger: #f87171;
  --unknown: #9ca3af;
  --on-level: #0b1110;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Noto Sans SC", "Noto Sans KR", sans-serif;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
main {
  max-width: 640px; margin: 0 auto; padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  max-width: 640px; margin: 0 auto; padding-block: 16px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.latin { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; margin-left: 4px; }
h1 { font-size: 20px; margin: 0; letter-spacing: 0.02em; }
.tagline { margin: 0; font-size: 12px; color: var(--muted); }
#lang {
  font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
}

.banner {
  background: color-mix(in srgb, var(--caution) 14%, var(--card));
  border: 1px solid color-mix(in srgb, var(--caution) 40%, transparent);
  border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 8px 0 12px;
}

.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.slot {
  position: relative; display: flex; flex-direction: column; aspect-ratio: 3 / 4;
  border: 2px dashed var(--line); border-radius: 14px; background: var(--card);
  overflow: hidden; cursor: pointer;
}
.slot.primary { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.slot-title {
  position: absolute; top: 8px; left: 8px; z-index: 2; font-size: 12px; font-weight: 600;
  background: color-mix(in srgb, var(--card) 85%, transparent); padding: 2px 8px; border-radius: 999px;
}
.slot-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--muted); font-size: 13px; gap: 4px; padding: 8px; text-align: center;
}
.plus { font-size: 28px; color: var(--accent); }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot.filled { border-style: solid; }
.slot.filled .slot-empty { visibility: hidden; }
.remove {
  position: absolute; top: 6px; right: 6px; z-index: 2; width: 32px; height: 32px; border-radius: 50%;
  border: none; background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 18px; cursor: pointer;
}
.hint { font-size: 13px; color: var(--muted); margin: 12px 0; }

.cta {
  display: block; width: 100%; font: inherit; font-weight: 700; font-size: 17px;
  padding: 14px; border: none; border-radius: 12px; background: var(--accent); color: var(--accent-ink);
  cursor: pointer; margin-top: 8px;
}
.cta:active { transform: translateY(1px); }
.error { color: var(--danger); font-size: 14px; }

#loading { text-align: center; padding: 64px 0; color: var(--muted); }
.spinner {
  width: 40px; height: 40px; margin: 0 auto 16px; border-radius: 50%;
  border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; margin: 12px 0;
}
.card h2 { font-size: 16px; margin: 0 0 8px; }
.card p { margin: 6px 0; }
.overall { border-width: 2px; }
.overall-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
.overall .product-name { font-size: 18px; margin: 6px 0; word-break: break-word; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; margin: 10px 0 0; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; word-break: break-word; }

.badge {
  display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px;
  color: var(--on-level); white-space: nowrap; vertical-align: middle;
}
.lv-safe { background: var(--safe); }
.lv-low { background: var(--low); }
.lv-caution { background: var(--caution); }
.lv-warning { background: var(--warning); }
.lv-danger { background: var(--danger); }
.lv-unknown { background: var(--unknown); }

.lv-bg-safe { border-color: var(--safe); }
.lv-bg-low { border-color: var(--low); }
.lv-bg-caution { border-color: var(--caution); }
.lv-bg-warning { border-color: var(--warning); }
.lv-bg-danger { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 7%, var(--card)); }
.lv-bg-unknown { border-color: var(--unknown); }

.flags { list-style: none; margin: 0; padding: 0; }
.flags li { padding: 10px 0; border-top: 1px solid var(--line); }
.flags li:first-child { border-top: none; padding-top: 0; }
.flags p { margin: 4px 0 0; font-size: 14px; }
.who { font-size: 12px; color: var(--muted); }

.ingredients { list-style: none; margin: 0; padding: 0; }
.ing { padding: 10px 0 10px 12px; border-top: 1px solid var(--line); border-left: 3px solid transparent; }
.ing:first-child { border-top: none; }
.lv-border-caution { border-left-color: var(--caution); }
.lv-border-warning { border-left-color: var(--warning); }
.lv-border-danger { border-left-color: var(--danger); }
.ing-head { display: flex; align-items: center; gap: 8px; }
.ing-name { font-weight: 600; flex: 1; min-width: 0; word-break: break-word; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ing-sub { font-size: 12px; color: var(--muted); word-break: break-word; }
.ing-purpose { font-size: 13px; }
.ing-note { font-size: 13px; color: var(--muted); }
.ing-note.strong { color: var(--warning); }

.disclaimer { font-size: 12px; color: var(--muted); margin: 16px 0; }

.pill {
  display: inline-block; font-weight: 700; font-size: 14px; padding: 4px 12px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent) 14%, var(--card)); color: var(--text);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
}
.small { font-size: 13px; }
.muted { color: var(--muted); }
.chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; flex-direction: column; padding: 6px 12px; border-radius: 10px;
  border: 1px solid var(--line); font-weight: 600; line-height: 1.3;
}
.chip small { font-weight: 400; font-size: 11px; color: var(--muted); }
.chip-strong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--card)); }

/* ---------- shared ---------- */
.count:empty { display: none; }
.link-btn { font: inherit; font-size: 14px; color: var(--accent); background: none; border: none; padding: 4px 0; cursor: pointer; text-decoration: underline; }
.saved-note { font-size: 13px; color: var(--muted); }
.view-title { font-size: 18px; margin: 4px 0; }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }

/* ---------- history ---------- */
.history { list-style: none; margin: 0; padding: 0 0 80px; }
.h-item {
  display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 8px; margin-bottom: 8px;
}
.h-item.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.h-check { padding: 8px; cursor: pointer; }
.h-check input { width: 22px; height: 22px; accent-color: var(--accent); }
.h-open {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font: inherit; color: inherit;
  background: none; border: none; padding: 0; text-align: left; cursor: pointer;
}
.h-open img, .h-noimg { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex: none; background: var(--line); }
.h-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.h-name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.h-meta { font-size: 12px; color: var(--muted); }
.h-meta .badge { font-size: 11px; padding: 1px 8px; }
.h-del { width: 36px; height: 36px; flex: none; border: none; border-radius: 50%; background: none; color: var(--muted); font-size: 20px; cursor: pointer; }
.sticky-bar {
  position: sticky; bottom: 0; padding: 12px 0 max(12px, env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.cta:disabled { opacity: 0.45; cursor: default; }

/* ---------- compare ---------- */
.cmp-scroll { overflow-x: auto; margin: 0 -16px; padding: 0 16px; -webkit-overflow-scrolling: touch; }
.cmp { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
.cmp th, .cmp td { vertical-align: top; padding: 10px; border-bottom: 1px solid var(--line); background: var(--card); }
.cmp td { min-width: 150px; max-width: 200px; word-break: break-word; }
.cmp th {
  position: sticky; left: 0; z-index: 1; text-align: left; font-weight: 600; color: var(--muted);
  width: 88px; min-width: 88px; max-width: 88px; font-size: 12px; background: var(--bg);
  box-shadow: 1px 0 0 var(--line);
}
.cmp tr:first-child td, .cmp tr:first-child th { border-top: 1px solid var(--line); }
.cmp-thumb { width: 100%; max-width: 140px; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
.cell-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.cell-list .badge { font-size: 10px; padding: 1px 6px; }
.cell-list .shared { background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 6px; padding: 0 6px; font-weight: 600; }
.strong-text { font-weight: 700; color: var(--danger); }
.price {
  width: 100%; font: inherit; font-size: 15px; padding: 6px 8px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
.ppd { margin-top: 4px; font-weight: 700; color: var(--accent); }
.ai-box input {
  width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
#ai-loading { text-align: center; padding: 24px 0; color: var(--muted); }

/* ---------- score ---------- */
.score-card { display: flex; gap: 16px; align-items: flex-start; }
.ring { flex: none; }
.ring-bg { fill: none; stroke: var(--line); stroke-width: 10; }
.ring-fg { fill: none; stroke-width: 10; stroke-linecap: round; stroke: var(--grade-color, var(--unknown)); }
.ring-num { text-anchor: middle; dominant-baseline: middle; font-size: 30px; font-weight: 800; fill: var(--text); }
.ring-grade { text-anchor: middle; font-size: 13px; font-weight: 700; fill: var(--grade-color, var(--muted)); }
.grade-A { --grade-color: var(--safe); }
.grade-B { --grade-color: var(--low); }
.grade-C { --grade-color: var(--caution); }
.grade-D { --grade-color: var(--warning); }
.grade-E { --grade-color: var(--danger); }
.score-text { flex: 1; min-width: 0; }
.score-title { font-size: 13px; color: var(--muted); }
.score-desc { font-weight: 700; margin: 2px 0 6px; }
.deductions { list-style: none; margin: 0 0 6px; padding: 0; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.deductions .badge { font-size: 10px; padding: 1px 6px; }
.minus { color: var(--muted); font-variant-numeric: tabular-nums; }
details summary { cursor: pointer; }
.h-score {
  display: inline-flex; align-items: baseline; gap: 2px; font-weight: 800; font-size: 13px;
  color: var(--grade-color); border: 1.5px solid var(--grade-color); border-radius: 8px; padding: 0 6px;
}
.h-score small { font-size: 10px; font-weight: 700; }
.h-score.big { font-size: 22px; padding: 2px 10px; }
.h-score.big small { font-size: 13px; }

/* ---------- bottom navigation ---------- */
body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: end;
  padding: 6px max(16px, calc(50% - 300px)) calc(6px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.nav-item, .nav-scan {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font: inherit; font-size: 11px; font-weight: 600; color: var(--muted);
  background: none; border: none; padding: 6px 0; cursor: pointer;
}
.nav-item.active, .nav-scan.active { color: var(--accent); }
.nav-item .count {
  position: absolute; top: 0; left: calc(50% + 8px); min-width: 18px; padding: 0 5px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font-size: 10px; line-height: 18px;
}
.nav-scan { padding: 0 24px; margin-top: -26px; }
.scan-circle {
  display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(145deg, #2dd4bf, #0f766e); color: #fff;
  box-shadow: 0 6px 16px color-mix(in srgb, #0f766e 40%, transparent); border: 4px solid var(--bg);
}
.nav-scan.active .scan-circle { box-shadow: 0 6px 20px color-mix(in srgb, #0f766e 60%, transparent); }
.sticky-bar { bottom: calc(76px + env(safe-area-inset-bottom)); }

/* ---------- history cards ---------- */
.h-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 12px; overflow: hidden;
}
.h-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
.h-card .h-open { display: flex; align-items: flex-start; gap: 12px; padding: 12px; width: 100%; }
.h-card .h-open img, .h-card .h-noimg { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; flex: none; background: var(--line); }
.h-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.h-card .h-name { font-size: 15px; font-weight: 700; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.h-sub { font-size: 12px; color: var(--muted); }
.h-alerts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.alert-pill {
  font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid;
}
.alert-ing { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 50%, transparent); }
.alert-allergy { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
.alert-drug { color: var(--caution); border-color: color-mix(in srgb, var(--caution) 50%, transparent); }
.alert-none { color: var(--safe); border-color: color-mix(in srgb, var(--safe) 50%, transparent); }
.h-scorebox {
  flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 56px; height: 56px; border-radius: 12px; font-size: 22px; font-weight: 800; line-height: 1;
  color: var(--on-level); background: var(--grade-color, var(--unknown));
}
.h-scorebox small { font-size: 11px; font-weight: 700; margin-top: 3px; opacity: 0.9; }
.h-actions {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 12px; border-top: 1px solid var(--line); font-size: 13px;
}
.h-actions .h-check { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-weight: 600; }
.h-actions .h-check input { width: 20px; height: 20px; }
.h-actions .h-del { width: auto; height: auto; font-size: 12px; padding: 4px 8px; border-radius: 8px; }

</style>

function checkRules(ingredients, rawTexts = []) {
  const haystacks = [
    ...ingredients.flatMap((i) => [i.original, i.english, i.name]),
    ...rawTexts,
  ].filter(Boolean);
  const hits = [];
  for (const rule of RULES) {
    const matched = haystacks.find((h) => rule.patterns.some((p) => p.test(h)));
    if (matched) hits.push({ id: rule.id, level: rule.level, matched, msg: rule.msg });
  }
  return hits;
}

// Japan's 8 mandatory food allergens (特定原材料). Matching is deliberately conservative to
// avoid false alarms such as "coconut milk", "cocoa butter", "乳化剤" (emulsifier) or "乳酸" (lactic acid).

  { id: "shrimp", name: { ja: "えび", en: "Shrimp", zh: "虾", ko: "새우" }, patterns: [/shrimp|prawn/i, /えび|エビ|海老/, /虾|蝦/, /새우/] },

      /(?<!(?:cocoa|shea|mango|cacao|kokum) )\bbutter\b/i,
      /牛乳|乳成分|乳製品|粉乳|乳糖|乳清|乳たんぱく|乳タンパク|チーズ|ホエイ|カゼイン|練乳|バター(?!ミルク)/,
      /牛奶|乳清蛋白|奶粉|酪蛋白/, /우유|유청|분유|카제인/,
    ],
  },

];

function detectAllergens(ingredients) {
  const texts = ingredients.flatMap((i) => [i.original, i.english]).filter(Boolean);
  const found = [];
  for (const a of ALLERGENS) {
    const source = texts.find((t) => a.patterns.some((p) => p.test(t)));
    if (source) found.push({ id: a.id, source });
  }
  return found;
}

// Combine the model's allergen list with the keyword hits so a mandatory allergen is never dropped.
function mergeAllergens(fromModel = [], detected = [], lang = "ja") {
  const merged = [...fromModel];
  for (const d of detected) {
    const a = ALLERGENS.find((x) => x.id === d.id);
    const already = merged.some((m) => a.patterns.some((p) => p.test(m.name)) || Object.values(a.name).includes(m.name));
    if (!already) merged.push({ name: a.name[lang] ?? a.name.ja, kind: "mandatory", source: d.source });
  }
  return merged;
}

// Mieru score: 0-100, higher = fewer concerns. Computed with a fixed formula from the
// per-ingredient levels (never asked from the AI), so the same analysis always gives the
// same score. Shared by the server and the browser.

const PENALTY = { danger: 40, warning: 20, caution: 8, low: 2, safe: 0, unknown: 0 };
const RANK = { safe: 0, low: 1, unknown: 1, caution: 2, warning: 3, danger: 4 };
// One serious ingredient caps the score no matter how clean the rest is.
const CAP = { danger: 20, warning: 50 };

const GRADES = [
  { min: 80, grade: "A" },
  { min: 60, grade: "B" },
  { min: 40, grade: "C" },
  { min: 20, grade: "D" },
  { min: 0, grade: "E" },
];

/**
 * @returns {{ score: number|null, grade: string|null, deductions: {label: string, level: string, points: number}[] }}
 * score is null when there is no ingredient list to judge.
 */
function computeScore(result) {
  const ingredients = result?.ingredients ?? [];
  if (!result?.readable || ingredients.length === 0) return { score: null, grade: null, deductions: [] };

  // A rule hit (Japan check) raises the level of the ingredient it matched.
  const ruleLevel = new Map();
  for (const h of result.rule_hits ?? []) {
    if (RANK[h.level] > RANK[ruleLevel.get(h.matched) ?? "safe"]) ruleLevel.set(h.matched, h.level);
  }
  const matchedTexts = new Set();
  const allergenSources = new Set((result.allergens ?? []).map((a) => a.source).filter(Boolean));

  const deductions = [];
  let worst = "safe";
  for (const i of ingredients) {
    let level = i.level;
    for (const text of [i.original, i.english, i.name]) {
      const r = ruleLevel.get(text);
      if (r) {
        matchedTexts.add(text);
        if (RANK[r] > RANK[level]) level = r;
      }
    }
    // Allergens matter only to people with that allergy; they are shown in the allergen
    // section instead of lowering everyone's score (unless a rule made them serious).
    if (allergenSources.has(i.original) && (level === "caution" || level === "low")) continue;
    if (RANK[level] > RANK[worst]) worst = level;
    if (PENALTY[level]) deductions.push({ label: i.name || i.original, level, points: PENALTY[level] });
  }
  // Rule hits that did not match an ingredient (e.g. found in the product name).
  for (const h of result.rule_hits ?? []) {
    if (!matchedTexts.has(h.matched) && PENALTY[h.level]) {
      deductions.push({ label: h.matched, level: h.level, points: PENALTY[h.level] });
      if (RANK[h.level] > RANK[worst]) worst = h.level;
    }
  }
  // Only an explicit "problem found" counts; a comment saying "no problem" must not cost points.
  if (result.claims_problem === true) deductions.push({ label: "claims", level: "caution", points: 5 });

  let score = 100 - deductions.reduce((sum, d) => sum + d.points, 0);
  if (CAP[worst] !== undefined) score = Math.min(score, CAP[worst]);
  score = Math.max(0, Math.min(100, Math.round(score)));
  const grade = GRADES.find((g) => score >= g.min).grade;
  deductions.sort((a, b) => b.points - a.points);
  return { score, grade, deductions };
}

// ---- public/finalize.js ----

const LEVEL_RANK = { safe: 0, low: 1, unknown: 1, caution: 2, warning: 3, danger: 4 };

// Add the rule-based Japan checks and keyword allergen detection to an AI result.
function finalize(result, lang, meta) {
  const hits = checkRules(result.ingredients, [result.product.name]);
  const allergens = mergeAllergens(result.allergens, detectAllergens(result.ingredients), lang);
  // A rule hit can raise the overall level but never lower what the model said.
  let level = result.overall.level;
  for (const h of hits) if (LEVEL_RANK[h.level] > LEVEL_RANK[level]) level = h.level;
  return {
    ...result,
    overall: { ...result.overall, level },
    allergens,
    rule_hits: hits.map((h) => ({ id: h.id, level: h.level, matched: h.matched, message: h.msg[lang] ?? h.msg.ja })),
    meta,
  };
}

// Keep only what the comparison needs, so the prompt stays small.
function slimForCompare(item) {
  const r = item.result ?? {};
  return {
    name: r.product?.name,
    brand: r.product?.brand,
    category: r.product?.category,
    origin: r.product?.origin_country,
    overall: r.overall,
    mieru_score: computeScore(r).score ?? "no ingredient list",
    label_type: r.food_label?.type,
    label_note: r.food_label?.explanation,
    claims_check: r.claims_check || undefined,
    supply: r.supply,
    price_yen: item.price || undefined,
    price_per_day_yen: item.price && r.supply?.days ? Math.round(item.price / r.supply.days) : undefined,
    ingredients: (r.ingredients ?? []).map((i) => ({ name: i.english || i.original, level: i.level, note: i.note })),
    intake: r.intake,
    interactions: r.interactions,
    allergens: r.allergens?.map((a) => a.name),
    rule_hits: r.rule_hits?.map((h) => h.id),
    japan_notes: r.japan_notes?.map((n) => n.title),
  };
}

// Side-by-side comparison table for 2-4 saved results.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const badgeHtml = (L, level) => `<span class="badge lv-${esc(level)}">${esc(L.levels[level] ?? level)}</span>`;

const SERIOUS = new Set(["caution", "warning", "danger"]);
const key = (i) => (i.english || i.original || "").toLowerCase().replace(/\s+extract$/, "").trim();

function pricePerDay(entry) {
  const price = Number(entry.price);
  const days = entry.result?.supply?.days;
  return price > 0 && days > 0 ? Math.round(price / days) : null;
}

function renderCompareTable(entries, L) {
  // Ingredients that appear in two or more products are highlighted.
  const counts = new Map();
  for (const e of entries) {
    for (const k of new Set((e.result.ingredients ?? []).map(key))) counts.set(k, (counts.get(k) ?? 0) + 1);
  }
  const list = (items) => (items.length ? `<ul class="cell-list">${items.join("")}</ul>` : `<span class="muted">${esc(L.none)}</span>`);

  const rows = [
    [L.photo, (e) => (e.thumb ? `<img class="cmp-thumb" src="${e.thumb}" alt="">` : "")],
    [L.product, (e) => `<strong>${esc(e.result.product?.name)}</strong><div class="muted small">${esc(e.result.product?.brand)}</div>`],
    [L.scoreTitle, (e) => {
      const sc = computeScore(e.result);
      return sc.score === null ? `<span class="muted">—</span>` : `<span class="h-score big grade-${sc.grade}">${sc.score}<small>${sc.grade}</small></span>`;
    }],
    [L.overall, (e) => badgeHtml(L, e.result.overall?.level)],
    [L.labelType, (e) => esc(L.labelTypes[e.result.food_label?.type] ?? L.categories[e.result.product?.category] ?? "—")],
    [L.supply, (e) => {
      const s = e.result.supply;
      if (!s) return "—";
      return `${esc(s.per_day) || "—"}${s.days > 0 ? `<div class="muted small">${esc(L.daysUnit.replace("{n}", s.days))}</div>` : ""}`;
    }],
    [L.price, (e) => {
      const ppd = pricePerDay(e);
      return `<input class="price" type="number" inputmode="numeric" min="0" placeholder="¥" value="${esc(e.price)}" data-id="${esc(e.id)}" aria-label="${esc(L.price)}">
        <div class="ppd small" data-ppd="${esc(e.id)}">${ppd ? `${esc(L.perDay)} ¥${ppd.toLocaleString()}` : ""}</div>`;
    }],
    [L.cautionIngredients, (e) => list((e.result.ingredients ?? []).filter((i) => SERIOUS.has(i.level)).map((i) => `<li>${badgeHtml(L, i.level)} ${esc(i.name)}</li>`))],
    [L.ruleHits, (e) => list((e.result.rule_hits ?? []).map((h) => `<li>${badgeHtml(L, h.level)} ${esc(h.matched)}</li>`))],
    [L.allergens, (e) => list((e.result.allergens ?? []).map((a) => `<li class="${a.kind === "mandatory" ? "strong-text" : ""}">${esc(a.name)}</li>`))],
    [L.interactions, (e) => list((e.result.interactions ?? []).map((i) => `<li>${badgeHtml(L, i.level)} ${esc(i.substance)} × ${esc(i.with_what)}</li>`))],
    [L.intake, (e) => list((e.result.intake ?? []).map((n) => `<li>${badgeHtml(L, n.level)} ${esc(n.nutrient)} <span class="muted">${esc(n.amount)}</span></li>`))],
    [L.commonIngredients, (e) => list((e.result.ingredients ?? []).map((i) => `<li class="${(counts.get(key(i)) ?? 0) > 1 ? "shared" : ""}">${esc(i.name)}</li>`))],
  ];

  return `<div class="cmp-scroll"><table class="cmp">
    <tbody>${rows
      .map(([label, cell]) => `<tr><th scope="row">${esc(label)}</th>${entries.map((e) => `<td>${cell(e)}</td>`).join("")}</tr>`)
      .join("")}</tbody></table></div>`;
}

function renderAiCompare(r, L) {
  const block = (title, inner) => (inner ? `<section class="card"><h2>${esc(title)}</h2>${inner}</section>` : "");
  return `
    ${block(L.aiResult, `<p>${esc(r.summary)}</p>`)}
    ${block(L.bestFor, r.best_for?.length ? `<ul class="flags">${r.best_for.map((b) => `<li><span class="who">${esc(b.situation)}</span><br><strong>${esc(b.choice)}</strong><p>${esc(b.reason)}</p></li>`).join("")}</ul>` : "")}
    ${block(L.differences, r.differences?.length ? `<ul class="flags">${r.differences.map((d) => `<li><strong>${esc(d.aspect)}</strong><p>${esc(d.detail)}</p></li>`).join("")}</ul>` : "")}
    ${block(L.overlap, r.overlap ? `<p>${esc(r.overlap)}</p>` : "")}
    ${block(L.cautions, r.cautions?.length ? `<ul class="flags">${r.cautions.map((c) => `<li><p>${esc(c)}</p></li>`).join("")}</ul>` : "")}`;
}

// ---- artifact/store.js ----
// claude.ai artifact history store: each viewer's history lives in their own private
// subtree of the artifact's database (data/users/<id>), so it follows them between iPhone
// and Mac. Falls back to this browser's storage when the database is unavailable.
const KEY = "mieru.history.v1";
const MAX_ITEMS = 30;

let cache = localLoad();
let col = null;
let listener = () => {};
const priceTimers = new Map();

function onHistoryChange(fn) {
  listener = fn;
}

function localLoad() {
  try {
    const list = JSON.parse(localStorage.getItem(KEY) || "[]");
    return Array.isArray(list) ? list : [];
  } catch {
    return [];
  }
}
function localSave() {
  for (let n = cache.length; n > 0; n--) {
    try {
      localStorage.setItem(KEY, JSON.stringify(cache.slice(0, n)));
      return;
    } catch {}
  }
}
function changed() {
  if (!col) localSave();
  listener();
}

(async () => {
  const [db, user] = await Promise.all([
    window.claude?.use ? window.claude.use("db") : null,
    window.claude?.use ? window.claude.use("user") : null,
  ]);
  const id = db && user ? await user.id() : null;
  if (!id) return; // stay on browser storage
  col = db.collection("data/users/" + id);
  col.orderBy("date", "desc").limit(100).onSnapshot(
    (snap) => {
      cache = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      listener();
    },
    () => {
      col = null; // database gone for this visit: keep working locally
      changed();
    }
  );
})();

function loadHistory() {
  return cache;
}

function addHistory(result, thumb) {
  const entry = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, date: new Date().toISOString(), thumb, result, price: "" };
  const dropped = cache.slice(MAX_ITEMS - 1);
  cache = [entry, ...cache].slice(0, MAX_ITEMS);
  changed();
  if (col) {
    const { id, ...body } = entry;
    col.doc(id).set(body).catch(() => {});
    for (const old of dropped) col.doc(old.id).delete().catch(() => {});
  }
  return entry;
}

function updateHistory(id, patch) {
  cache = cache.map((e) => (e.id === id ? { ...e, ...patch } : e));
  changed();
  if (!col) return;
  // Coalesce typing into one write per pause.
  clearTimeout(priceTimers.get(id));
  priceTimers.set(id, setTimeout(() => col?.doc(id).update(patch).catch(() => {}), 700));
}

function removeHistory(id) {
  cache = cache.filter((e) => e.id !== id);
  changed();
  col?.doc(id).delete().catch(() => {});
}

// ---- artifact/api.js ----
// claude.ai artifact backend: Claude is asked through the page's `sample` capability, on the
// viewer's own Claude plan (no API key, no server). PROMPTS is injected by build.mjs.

const samplePromise = window.claude?.use ? window.claude.use("sample") : Promise.resolve(null);

const LEVELS = ["safe", "low", "caution", "warning", "danger", "unknown"];
const lvl = (v) => (LEVELS.includes(v) ? v : "unknown");
const str = (v) => (typeof v === "string" ? v : v == null ? "" : String(v));
const arr = (v) => (Array.isArray(v) ? v : []);
const obj = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});

function b64ToBlob({ media_type, data }) {
  const bin = atob(data);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: media_type });
}

async function ask(prompt, options) {
  const sample = await samplePromise;
  if (!sample) throw new Error("unavailable");
  try {
    return await sample.json(prompt, options);
  } catch (e) {
    throw new Error(e?.code || "default");
  }
}

// The model's JSON is not validated by the platform, so fill in anything missing.
function normalizeAnalysis(raw) {
  const r = obj(raw);
  const p = obj(r.product);
  const ingredients = arr(r.ingredients).map((i) => {
    const o = obj(i);
    return { original: str(o.original), english: str(o.english), name: str(o.name || o.original), purpose: str(o.purpose), level: lvl(o.level), note: str(o.note) };
  });
  return {
    readable: typeof r.readable === "boolean" ? r.readable : ingredients.length > 0,
    product: {
      name: str(p.name), brand: str(p.brand), category: str(p.category) || "unknown",
      origin_country: str(p.origin_country), label_languages: arr(p.label_languages).map(str),
    },
    supply: { per_day: str(obj(r.supply).per_day), days: Number(obj(r.supply).days) || 0 },
    overall: { level: lvl(obj(r.overall).level), summary: str(obj(r.overall).summary) },
    food_label: { type: str(obj(r.food_label).type) || "unknown", notification_number: str(obj(r.food_label).notification_number), explanation: str(obj(r.food_label).explanation) },
    allergens: arr(r.allergens).map((a) => ({ name: str(obj(a).name), kind: ["mandatory", "recommended"].includes(obj(a).kind) ? obj(a).kind : "other", source: str(obj(a).source) })).filter((a) => a.name),
    intake: arr(r.intake).map((n) => ({ nutrient: str(obj(n).nutrient), amount: str(obj(n).amount), level: lvl(obj(n).level), detail: str(obj(n).detail) })),
    interactions: arr(r.interactions).map((n) => ({ substance: str(obj(n).substance), with_what: str(obj(n).with_what), level: lvl(obj(n).level), detail: str(obj(n).detail) })),
    ingredients,
    japan_notes: arr(r.japan_notes).map((n) => ({ title: str(obj(n).title), level: lvl(obj(n).level), detail: str(obj(n).detail) })),
    cautions: arr(r.cautions).map((c) => ({ title: str(obj(c).title), who: str(obj(c).who), detail: str(obj(c).detail) })),
    claims_problem: r.claims_problem === true,
    claims_check: str(r.claims_check),
    confidence: ["high", "medium", "low"].includes(r.confidence) ? r.confidence : "medium",
    missing: str(r.missing),
  };
}

const api = {
  async analyze(images, lang) {
    const prompt = `${ANALYZE_SYSTEM}

The ${images.length} attached image(s) are photos of ONE product (front, back label / ingredient list, other sides).
Analyse this product. Output language: ${LANG_NAMES[lang] ?? "Japanese"}.

Reply with only one JSON object that follows this JSON Schema (descriptions explain each field). No other text.
${PROMPTS.analysisSchema}`;
    const raw = await ask(prompt, { images: images.map(b64ToBlob) });
    return finalize(normalizeAnalysis(raw), lang, { demo: false });
  },

  async compare(items, goal, lang) {
    const prompt = `${COMPARE_SYSTEM}

Products:
${JSON.stringify(items.map(slimForCompare), null, 1)}

User's goal: ${goal || "(not given)"}
Output language: ${LANG_NAMES[lang] ?? "Japanese"}.

Reply with only one JSON object that follows this JSON Schema. No other text.
${PROMPTS.compareSchema}`;
    const r = obj(await ask(prompt, { cache: false }));
    return {
      summary: str(r.summary),
      best_for: arr(r.best_for).map((b) => ({ situation: str(obj(b).situation), choice: str(obj(b).choice), reason: str(obj(b).reason) })),
      differences: arr(r.differences).map((d) => ({ aspect: str(obj(d).aspect), detail: str(obj(d).detail) })),
      overlap: str(r.overlap),
      cautions: arr(r.cautions).map(str),
    };
  },

  async isDemo() {
    return false;
  },
};

// ---- public/app.js ----

const MAX_SIDE = 1568; // longest edge sent to the server; keeps uploads small but text legible
const photos = [null, null, null, null];
let lang = loadLang();
let lastResult = null;

const $ = (sel, root = document) => root.querySelector(sel);
const t = () => I18N[lang];

function loadLang() {
  try {
    const saved = localStorage.getItem("lang");
    if (saved && I18N[saved]) return saved;
  } catch {}
  const nav = (navigator.language || "ja").slice(0, 2);
  return I18N[nav] ? nav : "ja";
}

function applyLang() {
  document.documentElement.lang = lang;
  $("#lang").value = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t()[el.dataset.i18n]));
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", t()[el.dataset.i18nAria]));
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => el.setAttribute("placeholder", t()[el.dataset.i18nPlaceholder]));
  if (lastResult && !$("#result").hidden) renderResult(lastResult);
  renderHistory();
  if (!$("#compare").hidden) renderCompare();
}

$("#lang").addEventListener("change", (e) => {
  lang = e.target.value;
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
});

// ---------- photo slots ----------
document.querySelectorAll(".slot").forEach((slot) => {
  const idx = Number(slot.dataset.slot);
  const input = $("input", slot);
  const img = $("img", slot);
  const removeBtn = $(".remove", slot);

  input.addEventListener("change", async () => {
    const file = input.files?.[0];
    if (!file) return;
    try {
      photos[idx] = await resize(file);
      img.src = `data:${photos[idx].media_type};base64,${photos[idx].data}`;
      img.hidden = false;
      removeBtn.hidden = false;
      slot.classList.add("filled");
      hideError();
    } catch {
      showError(t().errors.bad_images);
    }
    input.value = "";
  });

  removeBtn.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    photos[idx] = null;
    img.hidden = true;
    img.removeAttribute("src");
    removeBtn.hidden = true;
    slot.classList.remove("filled");
  });
});

async function resize(file) {
  const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
  const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close?.();
  const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
  return { media_type: "image/jpeg", data: dataUrl.split(",")[1] };
}

// ---------- analyse ----------
$("#analyze").addEventListener("click", async () => {
  const images = photos.filter(Boolean);
  if (images.length === 0) return showError(t().needPhoto);
  hideError();
  $("#capture").hidden = true;
  $("#loading").hidden = false;
  try {
    const body = await api.analyze(images, lang);
    lastResult = body;
    renderResult(body, { saved: true });
    addHistory(body, await thumbnail(images[0]).catch(() => ""));
  } catch (err) {
    $("#capture").hidden = false;
    showError(t().errors[err.message] || t().errors.default);
  } finally {
    $("#loading").hidden = true;
  }
});

function showError(msg) { const el = $("#error"); el.textContent = msg; el.hidden = false; }
function hideError() { $("#error").hidden = true; }

// ---------- render ----------
const badge = (level) => `<span class="badge lv-${esc(level)}">${esc(t().levels[level] ?? level)}</span>`;

function renderResult(r, { saved = false } = {}) {
  const L = t();
  const p = r.product;
  const section = (title, inner) => (inner ? `<section class="card"><h2>${esc(title)}</h2>${inner}</section>` : "");

  const ruleHits = r.rule_hits?.length
    ? `<ul class="flags">${r.rule_hits.map((h) => `<li>${badge(h.level)} <strong>${esc(h.matched)}</strong><p>${esc(h.message)}</p></li>`).join("")}</ul>`
    : "";
  const japan = r.japan_notes?.length
    ? `<ul class="flags">${r.japan_notes.map((n) => `<li>${badge(n.level)} <strong>${esc(n.title)}</strong><p>${esc(n.detail)}</p></li>`).join("")}</ul>`
    : "";
  const cautions = r.cautions?.length
    ? `<ul class="flags">${r.cautions.map((c) => `<li><strong>${esc(c.title)}</strong>${c.who ? ` <span class="who">${esc(c.who)}</span>` : ""}<p>${esc(c.detail)}</p></li>`).join("")}</ul>`
    : "";
  const ingredients = r.ingredients?.length
    ? `<ol class="ingredients">${r.ingredients
        .map(
          (i) => `<li class="ing lv-border-${esc(i.level)}">
            <div class="ing-head"><span class="dot lv-${esc(i.level)}" title="${esc(L.levels[i.level])}"></span>
              <span class="ing-name">${esc(i.name)}</span>${badge(i.level)}</div>
            <div class="ing-sub">${esc(i.original)}${i.english && i.english !== i.original ? ` · ${esc(i.english)}` : ""}</div>
            ${i.purpose ? `<div class="ing-purpose">${esc(i.purpose)}</div>` : ""}
            ${i.note ? `<div class="ing-note${["caution","warning","danger"].includes(i.level) ? " strong" : ""}">${esc(i.note)}</div>` : ""}
          </li>`
        )
        .join("")}</ol>`
    : "";

  const fl = r.food_label;
  const labelType =
    fl && fl.type !== "not_food"
      ? `<p><span class="pill">${esc(L.labelTypes[fl.type] ?? fl.type)}</span></p>
         ${fl.notification_number ? `<p class="small"><strong>${esc(L.notifNo)}:</strong> ${esc(fl.notification_number)}</p>` : ""}
         ${fl.explanation ? `<p>${esc(fl.explanation)}</p>` : ""}
         ${fl.type === "kinousei" ? `<p class="small muted">${esc(L.verifyHint)}</p>` : ""}`
      : "";
  const allergenList = r.allergens?.length
    ? `<ul class="chips">${r.allergens
        .map((a) => `<li class="chip ${a.kind === "mandatory" ? "chip-strong" : ""}" title="${esc(a.source)}">${esc(a.name)}<small>${esc(L.allergenKinds[a.kind] ?? "")}</small></li>`)
        .join("")}</ul>`
    : "";
  const intake = r.intake?.length
    ? `<ul class="flags">${r.intake.map((n) => `<li>${badge(n.level)} <strong>${esc(n.nutrient)}</strong> <span class="who">${esc(n.amount)}</span><p>${esc(n.detail)}</p></li>`).join("")}</ul>`
    : "";
  const interactions = r.interactions?.length
    ? `<ul class="flags">${r.interactions.map((n) => `<li>${badge(n.level)} <strong>${esc(n.substance)}</strong> × ${esc(n.with_what)}<p>${esc(n.detail)}</p></li>`).join("")}</ul>`
    : "";

  $("#result").innerHTML = `
    ${scoreCard(r, L)}
    <section class="card overall lv-bg-${esc(r.overall.level)}">
      <div class="overall-head"><span>${esc(L.overall)}</span>${badge(r.overall.level)}</div>
      <h2 class="product-name">${esc(p.name)}</h2>
      <p>${esc(r.overall.summary)}</p>
      <dl class="meta">
        <dt>${esc(L.brand)}</dt><dd>${esc(p.brand) || "—"}</dd>
        <dt>${esc(L.category)}</dt><dd>${esc(L.categories[p.category] ?? p.category)}</dd>
        <dt>${esc(L.origin)}</dt><dd>${esc(p.origin_country) || "—"}</dd>
        <dt>${esc(L.labelLang)}</dt><dd>${esc((p.label_languages || []).join(", ")) || "—"}</dd>
        <dt>${esc(L.confidence)}</dt><dd>${esc(L.conf[r.confidence] ?? r.confidence)}</dd>
      </dl>
    </section>
    ${section(L.ruleHits, ruleHits)}
    ${section(L.labelType, labelType)}
    ${section(L.allergens, allergenList)}
    ${section(L.interactions, interactions)}
    ${section(L.intake, intake)}
    ${section(L.japanNotes, japan)}
    ${section(L.cautions, cautions)}
    ${section(L.ingredients, ingredients)}
    ${section(L.claims, r.claims_check ? `<p>${esc(r.claims_check)}</p>` : "")}
    ${section(L.missing, r.missing ? `<p>${esc(r.missing)}</p>` : "")}
    ${saved ? `<p class="saved-note">${esc(L.savedNote)} <button type="button" class="link-btn" id="to-history">${esc(L.toHistory)}</button></p>` : ""}
    <p class="disclaimer">${esc(L.disclaimer)}</p>
    <button type="button" class="cta" id="again">${esc(L.again)}</button>
  `;
  $("#result").hidden = false;
  $("#again").addEventListener("click", reset);
  $("#to-history")?.addEventListener("click", () => showTab("history"));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function reset() {
  lastResult = null;
  $("#result").hidden = true;
  $("#capture").hidden = false;
  document.querySelectorAll(".slot .remove").forEach((b) => b.hidden || b.click());
}

// ---------- score ----------
function scoreRing(sc, size = 88) {
  const r = 40, c = 2 * Math.PI * r;
  const val = sc.score ?? 0;
  return `<svg class="ring grade-${sc.grade ?? "none"}" viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true">
    <circle cx="50" cy="50" r="${r}" class="ring-bg"/>
    <circle cx="50" cy="50" r="${r}" class="ring-fg" stroke-dasharray="${(c * val) / 100} ${c}" transform="rotate(-90 50 50)"/>
    <text x="50" y="50" class="ring-num">${sc.score ?? "—"}</text>
    <text x="50" y="70" class="ring-grade">${sc.grade ?? ""}</text></svg>`;
}

function scoreCard(r, L) {
  const sc = computeScore(r);
  const reasons = sc.deductions
    .slice(0, 6)
    .map((d) => `<li>${badge(d.level)} ${esc(d.label === "claims" ? L.claims : d.label)} <span class="minus">−${d.points}</span></li>`)
    .join("");
  return `<section class="card score-card">
    ${scoreRing(sc)}
    <div class="score-text">
      <div class="score-title">${esc(L.scoreTitle)}</div>
      <div class="score-desc">${esc(sc.score === null ? L.scoreNone : L.gradeDesc[sc.grade])}</div>
      ${reasons ? `<ul class="deductions">${reasons}</ul>` : sc.score === 100 ? `<p class="small muted">${esc(L.noDeductions)}</p>` : ""}
      <details class="small muted"><summary>${esc(L.scoreHow)}</summary><p>${esc(L.scoreHowText)}</p></details>
    </div>
  </section>`;
}

// ---------- thumbnails ----------
function thumbnail(img, side = 240) {
  return new Promise((resolve, reject) => {
    const el = new Image();
    el.onload = () => {
      const scale = Math.min(1, side / Math.max(el.width, el.height));
      const c = document.createElement("canvas");
      c.width = Math.round(el.width * scale);
      c.height = Math.round(el.height * scale);
      c.getContext("2d").drawImage(el, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };
    el.onerror = reject;
    el.src = `data:${img.media_type};base64,${img.data}`;
  });
}

// ---------- tabs ----------
function showTab(tab) {
  // "compare" opens the last comparison, or the history list to pick products first.
  if (tab === "compare") {
    // Use the products checked in the history list, if any.
    if (selected.size >= 2 && [...selected].join() !== compareIds.join()) {
      compareIds = [...selected];
      $("#ai-result").innerHTML = "";
      $("#compare-error").hidden = true;
    }
    if (compareEntries().length < 2) tab = "history";
    else renderCompare();
  }
  document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  $("#history").hidden = tab !== "history";
  $("#compare").hidden = tab !== "compare";
  if (tab === "scan") {
    const hasResult = lastResult && $("#result").innerHTML;
    $("#result").hidden = !hasResult;
    $("#capture").hidden = Boolean(hasResult);
  } else {
    $("#capture").hidden = true;
    $("#result").hidden = true;
    $("#loading").hidden = true;
  }
  window.scrollTo({ top: 0 });
}
document.querySelectorAll(".tab").forEach((b) =>
  b.addEventListener("click", () => {
    // Tapping Scan while a result is shown starts a new scan.
    if (b.dataset.tab === "scan" && !$("#result").hidden) reset();
    showTab(b.dataset.tab);
  })
);

// ---------- history ----------
const selected = new Set();

function renderHistory() {
  const L = t();
  const list = loadHistory();
  for (const id of [...selected]) if (!list.some((e) => e.id === id)) selected.delete(id);
  $("#history-count").textContent = list.length ? String(list.length) : "";
  $("#history-empty").hidden = list.length > 0;
  $("#history-list").innerHTML = list
    .map((e) => {
      const r = e.result;
      const date = new Date(e.date).toLocaleDateString(lang, { month: "short", day: "numeric" });
      const ppd = pricePerDay(e);
      const sc = computeScore(r);
      const serious = (r.ingredients ?? []).filter((i) => ["caution", "warning", "danger"].includes(i.level)).length;
      const alerts = [
        [serious, L.alertIngredients, "alert-ing"],
        [r.allergens?.length ?? 0, L.allergens, "alert-allergy"],
        [r.interactions?.length ?? 0, L.alertInteractions, "alert-drug"],
      ].filter(([n]) => n > 0);
      const isSel = selected.has(e.id);
      return `<li class="h-card ${isSel ? "selected" : ""}">
        <button type="button" class="h-open" data-open="${esc(e.id)}">
          ${e.thumb ? `<img src="${e.thumb}" alt="">` : `<span class="h-noimg"></span>`}
          <span class="h-body">
            <span class="h-name">${esc(r.product?.name)}</span>
            <span class="h-sub">${esc(L.categories[r.product?.category] ?? "")} · ${esc(date)}${ppd ? ` · ¥${ppd}/${esc(L.perDay)}` : ""}</span>
            <span class="h-alerts">${
              alerts.length
                ? alerts.map(([n, label, cls]) => `<span class="alert-pill ${cls}">${esc(label)} ${n}</span>`).join("")
                : `<span class="alert-pill alert-none">${esc(L.noAlerts)}</span>`
            }</span>
          </span>
          <span class="h-scorebox grade-${sc.grade ?? "none"}">${sc.score ?? "—"}<small>${sc.grade ?? ""}</small></span>
        </button>
        <div class="h-actions">
          <label class="h-check"><input type="checkbox" data-id="${esc(e.id)}" ${isSel ? "checked" : ""}> ${esc(L.addCompare)}</label>
          <button type="button" class="h-del" data-del="${esc(e.id)}">${esc(L.remove)}</button>
        </div>
      </li>`;
    })
    .join("");
  const n = selected.size;
  const btn = $("#compare-btn");
  btn.textContent = L.compareN.replace("{n}", n);
  btn.disabled = n < 2 || n > 4;
}

$("#history-list").addEventListener("change", (e) => {
  const id = e.target.dataset.id;
  if (!id) return;
  if (e.target.checked) {
    if (selected.size >= 4) { e.target.checked = false; return; }
    selected.add(id);
  } else selected.delete(id);
  renderHistory();
});

$("#history-list").addEventListener("click", (e) => {
  const open = e.target.closest("[data-open]")?.dataset.open;
  const del = e.target.closest("[data-del]")?.dataset.del;
  if (del) {
    selected.delete(del);
    removeHistory(del);
  } else if (open) {
    const entry = loadHistory().find((x) => x.id === open);
    if (!entry) return;
    lastResult = entry.result;
    renderResult(entry.result);
    showTab("scan");
  }
});

// ---------- compare ----------
let compareIds = [];

$("#compare-btn").addEventListener("click", () => {
  compareIds = [...selected];
  $("#ai-result").innerHTML = "";
  $("#compare-error").hidden = true;
  renderCompare();
  showTab("compare");
});
$("#back-history").addEventListener("click", () => showTab("history"));

function compareEntries() {
  const list = loadHistory();
  return compareIds.map((id) => list.find((e) => e.id === id)).filter(Boolean);
}

function renderCompare() {
  $("#compare-table").innerHTML = renderCompareTable(compareEntries(), t());
}

$("#compare-table").addEventListener("input", (e) => {
  const id = e.target.dataset.id;
  if (!id) return;
  updateHistory(id, { price: e.target.value });
  const entry = loadHistory().find((x) => x.id === id);
  const ppd = entry && pricePerDay(entry);
  document.querySelector(`[data-ppd="${CSS.escape(id)}"]`).textContent = ppd ? `${t().perDay} ¥${ppd.toLocaleString()}` : "";
});

$("#ai-compare-btn").addEventListener("click", async () => {
  const entries = compareEntries();
  $("#compare-error").hidden = true;
  $("#ai-result").innerHTML = "";
  $("#ai-loading").hidden = false;
  $("#ai-compare-btn").disabled = true;
  try {
    const body = await api.compare(entries.map((e) => ({ result: e.result, price: Number(e.price) || 0 })), $("#goal").value, lang);
    $("#ai-result").innerHTML = renderAiCompare(body, t());
  } catch (err) {
    const el = $("#compare-error");
    el.textContent = t().errors[err.message] || t().errors.default;
    el.hidden = false;
  } finally {
    $("#ai-loading").hidden = true;
    $("#ai-compare-btn").disabled = false;
  }
});

// ---------- init ----------
onHistoryChange(() => {
  renderHistory();
  // Keep the comparison table in sync when history changes elsewhere (another device), but
  // not while the viewer is typing a price into it.
  if (!$("#compare").hidden && !document.activeElement?.classList.contains("price")) renderCompare();
});
applyLang();
api.isDemo().then((demo) => ($("#demo-banner").hidden = !demo));

</script>
